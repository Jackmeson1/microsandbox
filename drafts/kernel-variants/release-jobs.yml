# DRAFT JOBS FRAGMENT. Merge these keys under jobs: in release.yml only after
# the prerequisites in KERNEL_VARIANT_CI_WORKFLOW_DRAFT.md are satisfied.
# The existing baseline firmware/runtime/SDK jobs stay as they are.

variant-profile-check:
  name: Validate six kernel feature profiles
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: python3 scripts/ci/kernel_variants.py check-profiles --profiles scripts/ci/kernel-variant-profiles.json

variant-firmware:
  name: Variant firmware (${{ matrix.arch }}, shard ${{ matrix.shard }})
  needs: [kernel-sources, variant-profile-check]
  runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
  timeout-minutes: 90
  strategy:
    fail-fast: false
    # Permit all 16 shards; the account-wide limit still queues excess jobs.
    max-parallel: 16
    matrix:
      arch: [x86_64, aarch64]
      shard: [0, 1, 2, 3, 4, 5, 6, 7]
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Checkout pinned libkrunfw
      run: git submodule update --init --depth 1 vendor/libkrunfw
    - name: Install kernel build dependencies
      run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev gcc make flex bison libelf-dev bc python3-pyelftools
    - name: Download shared kernel source archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: kernel-source
        path: vendor/libkrunfw/tarballs
    - name: Build and verify seven or eight kernels
      run: |
        python3 scripts/ci/kernel_variants.py build-shard \
          --profiles scripts/ci/kernel-variant-profiles.json \
          --arch '${{ matrix.arch }}' --shard '${{ matrix.shard }}' \
          --output variant-output
    - name: Upload compressed kernel bundles
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: variant-firmware-${{ matrix.arch }}-s${{ matrix.shard }}
        path: variant-output/firmware-${{ matrix.arch }}-s${{ matrix.shard }}.tar.gz
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

variant-link-linux:
  name: Variant libraries (${{ matrix.target }})
  needs: variant-firmware
  timeout-minutes: 90
  strategy:
    fail-fast: false
    matrix:
      include:
        - target: linux-x86_64
          arch: x86_64
          runner: ubuntu-latest
          image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b
        - target: linux-aarch64
          arch: aarch64
          runner: ubuntu-24.04-arm
          image: quay.io/pypa/manylinux_2_28_aarch64@sha256:561427136aabf3787bffb294b3515748241e0962d1527ae28bea1e076bfb9d99
  runs-on: ${{ matrix.runner }}
  container:
    image: ${{ matrix.image }}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Download only matching guest-architecture shards
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: variant-firmware-${{ matrix.arch }}-s*
        merge-multiple: true
        path: variant-archives
    - name: Verify bundles and link all 63 nondefault libraries
      run: |
        python3 scripts/ci/kernel_variants.py unpack \
          --arch '${{ matrix.arch }}' --archives variant-archives \
          --expected-archives 8 --output variant-input
        python3 scripts/ci/kernel_variants.py link-unix \
          --target '${{ matrix.target }}' --firmware variant-input \
          --output variant-libs
        python3 scripts/ci/kernel_variants.py verify-linked \
          --target '${{ matrix.target }}' --output variant-libs
        mapfile -d '' libraries < <(find variant-libs -name 'libkrunfw.so.5.6.1' -type f -print0)
        python3 scripts/ci/validate_linux_glibc.py --max-version 2.28 "${libraries[@]}"
    - name: Upload platform variant libraries and checksums
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: variant-libs-${{ matrix.target }}
        path: variant-libs/
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

variant-link-macos:
  name: Variant libraries (darwin-aarch64)
  needs: variant-firmware
  runs-on: macos-14
  timeout-minutes: 90
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Download aarch64 firmware shards
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: variant-firmware-aarch64-s*
        merge-multiple: true
        path: variant-archives
    - name: Verify bundles and link all 63 nondefault libraries
      run: |
        python3 scripts/ci/kernel_variants.py unpack \
          --arch aarch64 --archives variant-archives \
          --expected-archives 8 --output variant-input
        python3 scripts/ci/kernel_variants.py link-unix \
          --target darwin-aarch64 --firmware variant-input \
          --output variant-libs
        python3 scripts/ci/kernel_variants.py verify-linked \
          --target darwin-aarch64 --output variant-libs
    - name: Upload macOS variant libraries and checksums
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: variant-libs-darwin-aarch64
        path: variant-libs/
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

variant-link-windows:
  name: Variant libraries (windows-${{ matrix.arch }}, shard ${{ matrix.shard }})
  needs: variant-firmware
  runs-on: ${{ matrix.arch == 'aarch64' && 'windows-11-arm' || 'windows-latest' }}
  timeout-minutes: 90
  strategy:
    fail-fast: false
    # Permit all 16 shards; the account-wide limit still queues excess jobs.
    max-parallel: 16
    matrix:
      arch: [x86_64, aarch64]
      shard: [0, 1, 2, 3, 4, 5, 6, 7]
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Checkout pinned libkrunfw MSVC helpers
      shell: pwsh
      run: git submodule update --init --depth 1 vendor/libkrunfw
    - name: Download only this guest-architecture shard
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: variant-firmware-${{ matrix.arch }}-s${{ matrix.shard }}
        path: variant-archives
    - name: Link and verify seven or eight DLLs with native MSVC
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $arch = '${{ matrix.arch }}'
        $shard = [int]'${{ matrix.shard }}'
        $vsArch = if ($arch -eq 'aarch64') { 'arm64' } else { 'amd64' }
        $target = "windows-$arch"
        python scripts/ci/kernel_variants.py unpack `
          --arch $arch --archives variant-archives `
          --expected-archives 1 --output variant-input
        if ($LASTEXITCODE -ne 0) { throw 'firmware unpack failed' }
        $start = [Math]::Max(1, $shard * 8)
        $end = $shard * 8 + 7
        for ($mask = $start; $mask -le $end; $mask++) {
          $id = 'v{0:x2}' -f $mask
          $bundle = "variant-input/s$shard/$id/kernel.c"
          Copy-Item -LiteralPath $bundle vendor/libkrunfw/kernel.c -Force
          $out = "variant-build/$id/libkrunfw.dll"
          $import = "variant-build/$id/libkrunfw.lib"
          New-Item -ItemType Directory -Force -Path "vendor/libkrunfw/variant-build/$id" | Out-Null
          & .\vendor\libkrunfw\scripts\build-windows.ps1 `
            -SkipKernelBundle -AbiVersion 5 `
            -Architecture $vsArch -HostArchitecture $vsArch `
            -Output $out -ImportLibrary $import
          if ($LASTEXITCODE -ne 0) { throw "MSVC link failed for $id" }
          python scripts/ci/kernel_variants.py record-windows `
            --target $target --mask $mask --firmware variant-input `
            --library "vendor/libkrunfw/$out" --output variant-libs
          if ($LASTEXITCODE -ne 0) { throw "manifest failed for $id" }
        }
        python scripts/ci/kernel_variants.py verify-linked `
          --target $target --shard $shard --output variant-libs
        if ($LASTEXITCODE -ne 0) { throw 'library verification failed' }
    - name: Upload this Windows variant shard
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: variant-libs-windows-${{ matrix.arch }}-s${{ matrix.shard }}
        path: variant-libs/
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

variant-ready:
  name: Variant library barrier
  needs: [variant-link-linux, variant-link-macos, variant-link-windows]
  runs-on: ubuntu-latest
  steps:
    - name: Assert every variant link matrix succeeded
      run: |
        test '${{ needs.variant-link-linux.result }}' = success
        test '${{ needs.variant-link-macos.result }}' = success
        test '${{ needs.variant-link-windows.result }}' = success
